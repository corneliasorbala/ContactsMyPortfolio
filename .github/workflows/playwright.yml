steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 1. RUN TESTS TO GENERATE THE REPORT FIRST
      - name: Run Playwright tests
        run: npx playwright test
        # Use continue-on-error or always upload if you want the report even when tests fail:
        if: always() 

      # 2. THEN UPLOAD THE REPORT
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: '!cancelled()' # Uploads on pass or fail, but skips if job is cancelled
        with:
        path: 'playwright-report'

      # 3. DEPLOY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
